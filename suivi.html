<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi">
<meta name="theme-color" content="#13203A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1322" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Suivi en direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Suivi</b><span class="live off" id="live">Connexion…</span></div>
  </header>

  <!-- Pas de code / code invalide -->
  <div class="card" id="noCode" hidden>
    <div class="sect">
      <h2 id="noCodeTitle">Lien de suivi incomplet</h2>
      <p id="noCodeText">Ouvre le lien de suivi qu'on t'a envoyé, ou saisis le code de partage qu'il contient.</p>
      <form class="inline" id="codeForm" autocomplete="off">
        <input class="txt code" id="codeIn" maxlength="12" placeholder="Code de partage" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Code de partage">
        <button type="submit" class="btn">Ouvrir</button>
      </form>
      <p class="msg" id="codeMsg" role="status"></p>
    </div>
  </div>

  <main class="panel" id="view" hidden>
    <div class="ticket" aria-live="polite">
      <div class="t-head"><span class="t-name" id="vName">—</span></div>
      <div class="t-label" id="vLabel">Aujourd'hui</div>
      <div class="t-time" id="vTime">--:--</div>
      <span class="chip" id="vChip">—</span>
      <div class="track" aria-hidden="true"><div class="fill" id="vFill"></div></div>
      <div class="t-ends">
        <span>Badgé<b id="vArr">--:--</b></span>
        <span>Pause<b id="vPause">—</b></span>
        <span id="vEndL">Fin prévue<b id="vEnd">--:--</b></span>
      </div>
      <div class="t-sub" id="vSub"></div>
      <div class="t-foot" id="vFoot"></div>
    </div>

    <h2 class="sh">Cumul du mois</h2>
    <div class="card monthbar">
      <button type="button" id="mPrev" aria-label="Mois précédent">‹</button>
      <h2 id="mLabel">—</h2>
      <button type="button" id="mNext" aria-label="Mois suivant">›</button>
    </div>
    <div class="tiles" id="mTiles"></div>
    <p class="note" id="mNote"></p>
    <div class="card hlist" id="hList"></div>
    <p class="note">Page de suivi en lecture seule, actualisée automatiquement.</p>
  </main>
</div>

<script src="commun.js"></script>
<script>
(() => {
  const { dur, sdur, clockOf, esc, norm, today, msg, rpc } = P;
  const S = P.store('pdp.suivi.');
  const POLL_MS = 15000;
  const $ = id => document.getElementById(id);

  let code = norm(new URLSearchParams(location.search).get('c') || '');
  if (code) S.set('code', code); else code = S.get('code', '');
  let data = null, lastOk = 0, failed = false, viewMonth = today().slice(0, 7), loading = false;

  function showForm(title, text) {
    $('noCode').hidden = false; $('view').hidden = true;
    $('noCodeTitle').textContent = title; $('noCodeText').textContent = text;
    setLive();
  }

  async function load() {
    if (!code || loading) return;
    loading = true;
    const [de, a] = P.monthRange(viewMonth);
    try {
      const r = await rpc('pointeuse_suivi', { p_partage: code, p_de: de, p_a: a });
      if (!r) {
        data = null;
        showForm('Lien de suivi expiré', 'Ce lien ne fonctionne plus : la personne a créé un nouveau lien ou supprimé son compte. Demande-lui le nouveau lien.');
      } else {
        data = r; data.majTs = Date.parse(r.maj) || 0; data.month = viewMonth;
        lastOk = Date.now(); failed = false;
        $('noCode').hidden = true; $('view').hidden = false;
        document.title = 'Suivi de ' + (r.nom || 'la journée');
        render();
      }
    } catch (e) {
      failed = true; setLive();
      if (!data) showForm('Pas de connexion', 'Impossible de charger le suivi pour l\'instant. La page réessaie toute seule.');
    }
    loading = false;
  }

  function setLive() {
    const l = $('live');
    if (!data) { l.textContent = failed ? 'Hors ligne' : (code ? 'Connexion…' : 'Aucun suivi'); l.className = 'live off'; return; }
    const fresh = !failed && Date.now() - lastOk < 60000;
    l.textContent = fresh ? 'En direct' : 'Hors ligne · ' + clockOf(lastOk);
    l.className = 'live' + (fresh ? '' : ' off');
  }

  function agoText(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'Dernière action il y a ' + Math.max(0, s) + ' s';
    if (s < 3600) return 'Dernière action il y a ' + Math.floor(s / 60) + ' min';
    return 'Dernière action à ' + clockOf(ts);
  }

  function renderHero(now) {
    const e = data.etat || {};
    $('vName').textContent = data.nom || 'Sans nom';
    const recent = typeof e.arr === 'number' && now - e.arr < P.LIVE_MS && e.arr - now < 12 * 3600e3;
    const fill = $('vFill'), chip = $('vChip');
    const set = (label, time, chipText, cls, frac) => {
      $('vLabel').textContent = label; $('vTime').textContent = time;
      chip.textContent = chipText; chip.className = 'chip ' + (cls || '');
      fill.style.width = (Math.min(1, Math.max(0, frac || 0)) * 100).toFixed(1) + '%';
      fill.classList.toggle('done', cls === 'done');
    };
    if (!recent) {
      const days = (data.jours || []).filter(j => j.dep != null).sort((x, y) => x.jour < y.jour ? 1 : -1);
      set('Aujourd\'hui', '--:--', 'Pas encore badgé', '', 0);
      $('vArr').textContent = '--:--'; $('vPause').textContent = '—'; $('vEndL').firstChild.textContent = 'Fin prévue'; $('vEnd').textContent = '--:--';
      $('vSub').textContent = days.length ? 'Dernier jour badgé : ' + P.dayLabel(days[0].jour) + ', ' + clockOf(days[0].arr) + ' → ' + clockOf(days[0].dep) : '';
    } else {
      const t = e.target || 0, p = e.pause || 0, end = e.arr + (t + p) * 60000, span = end - e.arr;
      $('vArr').textContent = clockOf(e.arr); $('vPause').textContent = dur(p);
      if (typeof e.dep === 'number') {
        const w = P.worked({ arr: e.arr, dep: e.dep, pause: p }), diff = w - t;
        set('Journée terminée · départ', clockOf(e.dep), sdur(diff) + ' sur l\'objectif', diff >= 0 ? 'done' : 'over', span > 0 ? (e.dep - e.arr) / span : 1);
        $('vEndL').firstChild.textContent = 'Fin prévue'; $('vEnd').textContent = clockOf(end);
        $('vSub').innerHTML = 'Travaillé <b>' + dur(w) + '</b> pour un objectif de ' + dur(t);
      } else if (now < e.arr) {
        set('Arrivée prévue', clockOf(e.arr), 'Pas encore arrivé', '', 0);
        $('vEndL').firstChild.textContent = 'Fin prévue'; $('vEnd').textContent = clockOf(end);
        $('vSub').textContent = '';
      } else {
        const pres = Math.floor((now - e.arr) / 60000);
        $('vEndL').firstChild.textContent = 'Objectif'; $('vEnd').textContent = dur(t);
        if (now < end) set('Fin prévue', clockOf(end), 'Reste ' + dur(Math.ceil((end - now) / 60000)), 'run', span > 0 ? (now - e.arr) / span : 1);
        else set('Fin prévue', clockOf(end), 'Fin prévue passée · +' + dur(Math.floor((now - end) / 60000)), 'done', 1);
        $('vSub').innerHTML = 'Au travail depuis <b>' + clockOf(e.arr) + '</b> · présence ' + dur(pres) + (now >= end ? ' · sortie pas encore badgée' : '');
      }
    }
    $('vFoot').textContent = data.majTs ? agoText(data.majTs) : '';
  }

  function renderMonth(now) {
    $('mLabel').textContent = P.monthLabel(viewMonth);
    $('mNext').disabled = viewMonth >= today().slice(0, 7);
    const list = data.month === viewMonth ? (data.jours || []).slice().sort((x, y) => x.jour < y.jour ? 1 : -1) : [];
    const st = P.stats(list, now);
    $('mTiles').innerHTML = P.tilesHTML(st);
    $('mNote').textContent = data.month === viewMonth ? P.statsNote(st) : 'Chargement…';
    $('hList').innerHTML = list.length ? list.map(j => P.rowHTML(j, now, false)).join('')
      : '<p class="hempty">' + (data.month === viewMonth ? 'Aucun jour badgé ce mois-ci.' : 'Chargement…') + '</p>';
  }

  function render() {
    if (!data) return;
    const now = Date.now();
    renderHero(now); renderMonth(now); setLive();
  }

  $('mPrev').addEventListener('click', () => { viewMonth = P.shiftMonth(viewMonth, -1); render(); load(); });
  $('mNext').addEventListener('click', () => { viewMonth = P.shiftMonth(viewMonth, 1); render(); load(); });
  $('codeForm').addEventListener('submit', e => {
    e.preventDefault();
    const c = norm($('codeIn').value);
    if (c.length !== 8) { msg($('codeMsg'), 'Un code de partage fait 8 caractères.', 'err'); return; }
    code = c; S.set('code', c); msg($('codeMsg'), 'Recherche…');
    try { history.replaceState(null, '', location.pathname + '?c=' + encodeURIComponent(c)); } catch (err) {}
    load().then(() => { if (!data) msg($('codeMsg'), failed ? 'Pas de connexion. Réessaie quand tu as du réseau.' : 'Aucun suivi avec ce code. Vérifie les symboles.', 'err'); else { msg($('codeMsg'), ''); $('codeIn').value = ''; } });
  });

  if (!code) showForm('Lien de suivi incomplet', 'Ouvre le lien de suivi qu\'on t\'a envoyé, ou saisis le code de partage qu\'il contient.');
  else load();

  setInterval(() => { if (data) { const now = Date.now(); renderHero(now); setLive(); } }, 1000);
  setInterval(() => { if (data) renderMonth(Date.now()); }, 30000);
  setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  window.addEventListener('online', load);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
</body>
</html>
